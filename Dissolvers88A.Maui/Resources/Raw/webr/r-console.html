<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>DISSOLVERS 88A · R</title>
<style>
  :root{
    --bg:#EEF1FB; --navy:#0E1626; --navy-2:#16233B; --ink:#1E293B; --ink-2:#64748B;
    --border:#D8DEEF; --accent:#2563EB; --cyan:#38BDF8; --ok:#34D399; --amber:#F59E0B; --err:#F87171;
    --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --ui:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);
    display:flex;flex-direction:column;overflow:hidden}

  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
  .status{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-2);
    display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .dot.ready{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.err{background:var(--err)}
  .demos{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}
  .demos button, .act{background:#fff;border:1px solid var(--border);border-radius:9px;color:var(--ink);
    font-family:var(--ui);font-size:11px;font-weight:600;padding:6px 10px}
  .demos button:disabled{opacity:.5}
  .bridge{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 10px 6px;font-size:11px;color:var(--ink-2)}
  .bridge input{width:120px;font-family:var(--mono);font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:8px}
  .bridge select{font-size:12px;padding:4px;border:1px solid var(--border);border-radius:8px}

  main{flex:1;min-height:0;display:grid;gap:8px;padding:0 8px 8px;grid-template-rows:42% 1fr}

  .plot{background:#fff;border:2px solid var(--navy);border-radius:13px;position:relative;
    overflow:hidden;display:flex;align-items:center;justify-content:center}
  .plot canvas{max-width:100%;max-height:100%}
  .plot .empty{color:#94A3B8;font-family:var(--mono);font-size:12px}
  .plot .pager{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:11px;color:#475569;
    background:#ffffffd9;border:1px solid var(--border);padding:2px 7px;border-radius:6px;display:none}

  .console{background:var(--navy);border:1px solid var(--border);border-radius:13px;display:flex;flex-direction:column;overflow:hidden}
  .log{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;font-family:var(--mono);font-size:12px;
    line-height:1.45;white-space:pre-wrap;word-break:break-word;color:#C7D2E5}
  .log .in{color:#7DA9FF} .log .err{color:#F87171} .log .sys{color:#5B6E90;font-style:italic}
  .inbar{display:flex;border-top:1px solid #24324F;flex:none}
  .inbar span{color:var(--cyan);font-family:var(--mono);font-weight:700;display:flex;align-items:center;padding:0 6px 0 10px}
  .inbar input{flex:1;background:transparent;border:0;outline:0;color:#EAF1FF;font-family:var(--mono);font-size:13px;padding:10px 4px}
  .inbar button{background:var(--accent);color:#fff;border:0;font-weight:700;font-size:12px;padding:0 15px}
</style>
</head>
<body>
<div class="bar">
  <span class="act" id="syncBtn">Sync L1–L6 → R</span>
  <span class="status"><span class="dot" id="dot"></span><span id="stat">booting WebR…</span></span>
</div>
<div class="bridge">
  <span>pull</span>
  <input id="pullExpr" placeholder="R vector" autocomplete="off" autocapitalize="off" spellcheck="false" />
  <span>→</span>
  <select id="pullTarget">
    <option>L1</option><option>L2</option><option>L3</option><option>L4</option><option>L5</option><option>L6</option>
  </select>
  <span class="act" id="pullBtn">Pull</span>
</div>
<div class="demos" id="demos">
  <button data-r='plot(1:20,(1:20)^2,pch=19,col="#2563EB",xlab="x",ylab="x^2")'>y = x²</button>
  <button data-r='m<-lm(dist~speed,cars); plot(cars$speed,cars$dist,pch=19,col="#2563EB",xlab="speed",ylab="dist"); abline(m,col="#F59E0B",lwd=2); summary(m)'>lm(dist~speed)</button>
  <button data-r='hist(rnorm(400),col="#93C5FD",border="white",main="rnorm(400)")'>hist</button>
  <button data-r='summary(cars)'>summary(cars)</button>
</div>
<main>
  <div class="plot" id="pane"><div class="empty" id="empty">R plots render here</div><div class="pager" id="pager"></div></div>
  <div class="console">
    <div class="log" id="log"></div>
    <div class="inbar">
      <span>&gt;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type R, press Enter…" disabled />
      <button id="run" disabled>Run</button>
    </div>
  </div>
</main>

<script type="module">
import { WebR } from './webr.mjs';

const $ = id => document.getElementById(id);
const log = $('log'), cmd = $('cmd'), run = $('run'), dot = $('dot'), stat = $('stat');
const pane = $('pane'), empty = $('empty'), pager = $('pager');

function line(cls, t){ const d=document.createElement('div'); d.className=cls; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }
function setStat(k,t){ dot.className='dot '+k; stat.textContent=t; }

const pages=[]; let idx=-1, ctx=null;
function show(i){ pane.querySelectorAll('canvas').forEach(c=>c.style.display='none');
  if(pages[i]){pages[i].style.display='block';idx=i;} empty.style.display=pages.length?'none':'block';
  pager.style.display=pages.length>1?'block':'none'; pager.textContent=pages.length>1?`plot ${i+1} / ${pages.length}`:''; }
function newPage(){ const c=document.createElement('canvas'); c.width=1008;c.height=1008; pane.appendChild(c); pages.push(c); show(pages.length-1); return c.getContext('2d'); }
pane.addEventListener('click',()=>{ if(pages.length>1) show((idx+1)%pages.length); });

line('sys', `secure=${window.isSecureContext} crossOriginIsolated=${window.crossOriginIsolated} SAB=${typeof SharedArrayBuffer}`);
const webR = new WebR({
  baseUrl: new URL('./', location.href).href,
  serviceWorkerUrl: new URL('./', location.href).href,
  createLazyFilesystem: false,
});
const t0 = performance.now();
await webR.init();
await webR.evalRVoid('options(device=webr::canvas)');
const ver = await webR.evalRString('paste0(R.version$major,".",R.version$minor)');
const secs = ((performance.now()-t0)/1000).toFixed(1);
line('sys', `WebR ready — R ${ver} — ${secs}s`);
setStat('ready', `R ${ver} · ${secs}s`);
cmd.disabled=false; run.disabled=false;
document.querySelectorAll('#demos button').forEach(b=>b.disabled=false);

let busy=false, tStart=0;
(async function loop(){ for(;;){ const o=await webR.read();
  if(o.type==='stdout') line('out', o.data);
  else if(o.type==='stderr') line('err', o.data);
  else if(o.type==='canvas'){ if(o.data.event==='canvasNewPage') ctx=newPage(); else if(o.data.event==='canvasImage'&&ctx){ ctx.drawImage(o.data.image,0,0); show(pages.length-1);} }
  else if(o.type==='prompt' && busy){
    busy=false; run.disabled=false; setStat('ready','idle');
    line('sys', `(${((performance.now()-tStart)/1000).toFixed(2)}s)`);
  }
}})();

function runR(code){
  if(busy||!code.trim()) return;
  busy=true; tStart=performance.now(); setStat('busy','running…'); run.disabled=true;
  code.split('\n').forEach(l=>line('in','> '+l));
  webR.writeConsole(code+'\n');
}
run.addEventListener('click',()=>{ const v=cmd.value; cmd.value=''; runR(v); });
cmd.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=cmd.value; cmd.value=''; runR(v); } });
document.querySelectorAll('#demos button').forEach(b=>b.addEventListener('click',()=>runR(b.dataset.r)));

// ---- bridge to the MAUI host ----------------------------------------
window.d88a = {
  // C# → JS : push the calculator's lists into R as L1…L6
  async setLists(obj){
    let n = 0;
    for (const name of Object.keys(obj)){
      const v = obj[name];
      const rhs = (v && v.length) ? `c(${v.join(',')})` : 'NULL';
      try { await webR.evalRVoid(`${name} <- ${rhs}`); } catch(e){ line('err', String(e)); }
      if (v && v.length) n++;
    }
    line('sys', `Synced ${n} list(s) → R (L1–L6).`);
  },
  // JS → C# : evaluate an R expression, hand the numbers back to the host
  async requestPull(expr, target){
    try {
      const r = await webR.evalRString(
        `paste(format(${expr}, digits = 12, scientific = FALSE), collapse = " ")`);
      location.href = `dissolvers://pull?target=${target}&data=${encodeURIComponent(r)}`;
    } catch(e){
      line('err', `'${expr}' is empty or not numeric.`);
    }
  },
};
$('syncBtn').addEventListener('click', ()=> location.href = 'dissolvers://sync');
$('pullBtn').addEventListener('click', ()=>{
  const expr = $('pullExpr').value.trim();
  if (expr) window.d88a.requestPull(expr, $('pullTarget').selectedIndex);
});
</script>
</body>
</html>
