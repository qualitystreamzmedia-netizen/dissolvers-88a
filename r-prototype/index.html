<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DISSOLVERS 88A · R</title>
<style>
  :root{
    --bg:#EEF1FB; --panel:#FFFFFF; --navy:#0E1626; --navy-soft:#16233B;
    --ink:#1E293B; --ink-2:#64748B; --border:#D8DEEF;
    --accent:#2563EB; --accent-soft:#E4ECFF; --cyan:#38BDF8; --amber:#F59E0B;
    --ok:#34D399; --err:#F87171;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
    display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
  .brand{font-weight:800;letter-spacing:.3px;font-size:15px;color:var(--navy)}
  .badge{background:var(--accent);color:#fff;font-weight:800;font-size:10px;
    padding:2px 6px;border-radius:6px}
  .tag{margin-left:2px;font-size:11px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);padding:3px 8px;border-radius:999px}
  .status{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-2);
    font-family:var(--mono);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .dot.ready{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.err{background:var(--err)}

  main{flex:1;min-height:0;display:grid;gap:10px;padding:0 10px 10px;
    grid-template-rows:minmax(200px,42%) 1fr}
  @media (min-width:820px){
    main{grid-template-rows:none;grid-template-columns:1fr 1fr}
  }

  /* plot pane — the "plot screen", styled like the calculator's Graph tab */
  .plot{background:var(--navy);border:1px solid var(--navy);border-radius:14px;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .plot canvas{max-width:100%;max-height:100%;image-rendering:auto}
  .plot .empty{color:#4B5D80;font-family:var(--mono);font-size:12px;text-align:center;padding:16px}
  .plot .pager{position:absolute;left:10px;bottom:8px;font-family:var(--mono);
    font-size:11px;color:#8CA0C4;background:#0d1627cc;padding:3px 8px;border-radius:7px;display:none}

  /* console */
  .console{background:var(--navy);border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden}
  .log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;font-family:var(--mono);
    font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#C7D2E5}
  .log .in{color:#7DA9FF}
  .log .out{color:#DDE7F5}
  .log .msg{color:#8CA0C4}
  .log .warn{color:#FBBF24}
  .log .err{color:#F87171}
  .log .sys{color:#5B6E90;font-style:italic}
  .inbar{display:flex;align-items:stretch;gap:0;border-top:1px solid #24324f;flex:none}
  .inbar .prompt{color:var(--cyan);font-family:var(--mono);font-weight:700;
    display:flex;align-items:center;padding:0 8px 0 12px}
  .inbar input{flex:1;background:transparent;border:0;outline:0;color:#EAF1FF;
    font-family:var(--mono);font-size:13px;padding:11px 6px}
  .inbar button{background:var(--accent);color:#fff;border:0;font-weight:700;
    font-family:var(--ui);font-size:12px;padding:0 16px;cursor:pointer}
  .inbar button:disabled{opacity:.5;cursor:default}

  .demos{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 0}
  .demos button{background:var(--panel);border:1px solid var(--border);border-radius:9px;
    color:var(--ink);font-family:var(--ui);font-size:11px;font-weight:600;
    padding:6px 10px;cursor:pointer}
  .demos button:hover{border-color:var(--accent)}
  .demos button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <span class="brand">DISSOLVERS</span><span class="badge">88A</span><span class="tag">R console · prototype</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">booting WebR…</span></span>
</header>

<div class="demos" id="demos">
  <button data-r='plot(1:20, (1:20)^2, pch=19, col="#38BDF8", col.axis="#8CA0C4", col.lab="#8CA0C4", fg="#4B5D80", bg="#0E1626")'>scatter y = x²</button>
  <button data-r='m <- lm(dist ~ speed, cars); plot(cars$speed, cars$dist, pch=19, col="#38BDF8", col.axis="#8CA0C4", col.lab="#8CA0C4", fg="#4B5D80"); abline(m, col="#F59E0B", lwd=2); summary(m)'>lm(dist ~ speed)</button>
  <button data-r='hist(rnorm(500), col="#2563EB", border="#0E1626", col.axis="#8CA0C4", col.lab="#8CA0C4", fg="#4B5D80", main="rnorm(500)")'>hist(rnorm)</button>
  <button data-r='boxplot(count ~ spray, data=InsectSprays, col="#38BDF8", col.axis="#8CA0C4", fg="#4B5D80")'>boxplot</button>
  <button data-r='summary(cars)'>summary(cars)</button>
  <button data-r='curve(sin(x)/x, -20, 20, n=400, col="#38BDF8", col.axis="#8CA0C4", col.lab="#8CA0C4", fg="#4B5D80")'>curve sin(x)/x</button>
</div>

<main>
  <div class="plot" id="plotPane">
    <div class="empty" id="plotEmpty">plots render here<br>— the shared plot screen —</div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="console">
    <div class="log" id="log"></div>
    <div class="inbar">
      <span class="prompt">&gt;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="type R, press Enter…  (try: fivenum(faithful$eruptions))" disabled />
      <button id="run" disabled>Run</button>
    </div>
  </div>
</main>

<script type="module">
import { WebR } from './node_modules/@r-wasm/webr/dist/webr.mjs';

const logEl   = document.getElementById('log');
const cmdEl   = document.getElementById('cmd');
const runEl   = document.getElementById('run');
const dot     = document.getElementById('dot');
const statusT = document.getElementById('statusText');
const pane    = document.getElementById('plotPane');
const emptyEl = document.getElementById('plotEmpty');
const pager   = document.getElementById('pager');

function line(cls, text){
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(kind, text){
  dot.className = 'dot ' + kind;
  statusT.textContent = text;
}

// ---- plot screen: a stack of pages, newest shown ----
const pages = [];
let pageIdx = -1;
function showPage(i){
  pane.querySelectorAll('canvas').forEach(c => c.style.display = 'none');
  if (i >= 0 && pages[i]){ pages[i].style.display = 'block'; pageIdx = i; }
  emptyEl.style.display = pages.length ? 'none' : 'block';
  pager.style.display = pages.length > 1 ? 'block' : 'none';
  pager.textContent = pages.length > 1 ? `plot ${i+1} / ${pages.length}` : '';
}
function newPlotPage(){
  const c = document.createElement('canvas');
  c.width = 1008; c.height = 1008;               // webr canvas device default
  pane.appendChild(c);
  pages.push(c);
  showPage(pages.length - 1);
  return c.getContext('2d');
}
let ctx = null;
function onCanvasMessage(msg){
  if (msg.event === 'canvasNewPage'){ ctx = newPlotPage(); }
  else if (msg.event === 'canvasImage' && ctx){ ctx.drawImage(msg.image, 0, 0); showPage(pages.length-1); }
}
pane.addEventListener('click', () => {           // tap to page through history
  if (pages.length > 1) showPage((pageIdx + 1) % pages.length);
});

// ---- WebR ----
const webR = new WebR({ baseUrl: new URL('./node_modules/@r-wasm/webr/dist/', location.href).href });
const t0 = performance.now();
let busy = true;

await webR.init();
await webR.evalRVoid('options(device=webr::canvas)');
const ver = await webR.evalRString('paste(R.version$major, R.version$minor, sep=".")');
const secs = ((performance.now() - t0) / 1000).toFixed(1);

line('sys', `WebR ready — R ${ver} — cold start ${secs}s`);
line('sys', 'base R only (no package downloads). datasets: cars, faithful, InsectSprays, iris…');
setStatus('ready', `R ${ver} · ${secs}s`);
cmdEl.disabled = false; runEl.disabled = false;
document.querySelectorAll('#demos button').forEach(b => b.disabled = false);
cmdEl.focus();
busy = false;

// main read loop — stream stdout/stderr/canvas back from R
(async function loop(){
  for (;;){
    const out = await webR.read();
    switch (out.type){
      case 'stdout': line('out', out.data); break;
      case 'stderr': line('err', out.data); break;
      case 'canvas': onCanvasMessage(out.data); break;
      case 'prompt': /* R is waiting for input */ break;
    }
  }
})();

async function runR(code){
  if (busy || !code.trim()) return;
  busy = true;
  setStatus('busy', 'running…');
  runEl.disabled = true;
  code.split('\n').forEach(l => line('in', '> ' + l));
  const tr = performance.now();
  try {
    await webR.writeConsole(code + '\n');
    // give the read-loop a beat to drain, then time it
    await webR.evalRVoid('invisible(NULL)');
    line('sys', `(${((performance.now()-tr)/1000).toFixed(2)}s)`);
  } catch (e){
    line('err', String(e));
  }
  busy = false;
  setStatus('ready', 'idle');
  runEl.disabled = false;
  cmdEl.focus();
}

runEl.addEventListener('click', () => { const v = cmdEl.value; cmdEl.value=''; runR(v); });
cmdEl.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); const v = cmdEl.value; cmdEl.value=''; runR(v); }
});
document.querySelectorAll('#demos button').forEach(b =>
  b.addEventListener('click', () => runR(b.dataset.r)));
</script>
</body>
</html>
